<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1080px;
      height: 1920px;
      background: transparent;
      overflow: hidden;
      display: block;
      position: relative;
    }
    /* Top & Bottom Borders Only matching Height 1294px */
    .frame {
      position: absolute;
      left: 0px;
      top: 197px;
      width: 1080px;
      height: 1294px;
      border-top: 3px solid rgba(255, 255, 255, 0.85);
      border-bottom: 3px solid rgba(255, 255, 255, 0.85);
      border-left: none;
      border-right: none;
      box-shadow: 
        0 -4px 15px rgba(0, 0, 0, 0.5),
        0 4px 15px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="frame"></div>
</body>
</html>
